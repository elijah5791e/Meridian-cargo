<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ship manager — Meridian Cargo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230B1220'/%3E%3Crect x='28' y='28' width='44' height='44' rx='6' fill='none' stroke='%23FFB000' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2 3 7v10l9 5 9-5V7z"/>
          <path d="M3 7l9 5 9-5"/>
          <path d="M12 12v10"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Meridian Cargo</div>
        <div class="brand-tag">Ship manager</div>
      </div>
    </div>
    <a href="/" class="btn-secondary" style="text-decoration:none;">← Public tracking page</a>
  </header>

  <section class="view active" style="padding-top:36px;">
    <div id="gateWrap"></div>
    <div id="adminWrap" style="display:none;">
      <div class="admin-topline">
        <div class="stat-grid" id="statGrid"></div>
        <button class="btn-secondary" onclick="handleLogout()">Log out</button>
      </div>

      <div class="ship-grid">
        <div class="panel-box">
          <p class="panel-title">New shipment</p>
          <form id="createForm">
            <p class="form-subhead">From</p>
            <div class="field">
              <label for="c-sender-name">Sender name</label>
              <input type="text" id="c-sender-name" required placeholder="Aiko Tanaka">
            </div>
            <div class="field">
              <label for="c-sender-address">Sender address</label>
              <input type="text" id="c-sender-address" placeholder="14 Marina Rd, Lagos, NG">
            </div>
            <div class="field-row">
              <div class="field">
                <label for="c-sender-phone">Sender phone</label>
                <input type="tel" id="c-sender-phone" placeholder="+234 800 000 0000">
              </div>
              <div class="field">
                <label for="c-sender-email">Sender email</label>
                <input type="email" id="c-sender-email" placeholder="aiko@example.com">
              </div>
            </div>

            <p class="form-subhead">To</p>
            <div class="field">
              <label for="c-recipient-name">Recipient name</label>
              <input type="text" id="c-recipient-name" required placeholder="Jane Okafor">
            </div>
            <div class="field">
              <label for="c-recipient-address">Recipient address</label>
              <input type="text" id="c-recipient-address" placeholder="22 Wuse Zone 4, Abuja, NG">
            </div>
            <div class="field-row">
              <div class="field">
                <label for="c-recipient-phone">Recipient phone</label>
                <input type="tel" id="c-recipient-phone" placeholder="+234 800 000 0000">
              </div>
              <div class="field">
                <label for="c-email">Recipient email</label>
                <input type="email" id="c-email" placeholder="jane@example.com">
              </div>
            </div>

            <p class="form-subhead">Route &amp; package</p>
            <div class="field-row">
              <div class="field">
                <label for="c-origin">Origin (city)</label>
                <input type="text" id="c-origin" required placeholder="Lagos, NG">
              </div>
              <div class="field">
                <label for="c-destination">Destination (city)</label>
                <input type="text" id="c-destination" required placeholder="Abuja, NG">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="c-service">Service level</label>
                <select id="c-service">
                  <option value="Standard">Standard</option>
                  <option value="Express">Express</option>
                </select>
              </div>
              <div class="field">
                <label for="c-weight">Weight</label>
                <input type="text" id="c-weight" placeholder="2.3 kg">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="c-shipped">Date shipped</label>
                <input type="date" id="c-shipped">
              </div>
              <div class="field">
                <label for="c-eta">Estimated delivery</label>
                <input type="date" id="c-eta">
              </div>
            </div>

            <div class="field">
              <label>Package contents</label>
              <div id="contentsList" class="contents-list"></div>
              <button type="button" class="btn-add-item" onclick="addContentRow()">+ Add item</button>
            </div>

            <p class="form-subhead">Tracking number</p>
            <div class="field">
              <div class="tn-mode-toggle">
                <label class="radio-opt"><input type="radio" name="tnMode" value="auto" checked onchange="onTnModeChange()"> Auto-generate</label>
                <label class="radio-opt"><input type="radio" name="tnMode" value="custom" onchange="onTnModeChange()"> Choose my own</label>
              </div>
              <input type="text" id="c-custom-tn" placeholder="e.g. MC-CUSTOM-001" style="display:none;margin-top:8px;" autocomplete="off" spellcheck="false">
            </div>

            <button type="submit" class="btn-primary">Create shipment</button>
          </form>
          <div class="created-flag" id="createdFlag">
            <p class="lbl">Tracking number</p>
            <p class="num" id="createdNum"></p>
            <div class="created-actions">
              <button type="button" class="btn-secondary" id="copyCreatedBtn" onclick="copyCreatedNumber()">Copy</button>
              <button type="button" class="btn-secondary" id="receiptCreatedBtn" onclick="downloadCreatedReceipt()">Save receipt</button>
            </div>
          </div>
        </div>

        <div>
          <p class="panel-title" style="margin-bottom:14px;">All shipments</p>
          <div class="list-toolbar">
            <input type="text" id="searchBox" placeholder="Search name, email, tracking number, destination…">
            <select id="statusFilter">
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="Delivered">Delivered</option>
              <option value="Exception">Exception</option>
            </select>
            <select id="sortOrder">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </div>
          <div class="ship-list" id="shipList">
            <div class="empty-list">Loading shipments…</div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="/receipt.js"></script>
<script src="/admin.js"></script>
</body>
</html>
